<html lang="zh-Hant">

  <style>
    :root {
      --bg: #f6f8f4;
      --card: #ffffff;
      --text: #1c2822;
      --muted: #586960;
      --primary: #1f6f54;
      --primary-hover: #175640;
      --primary-light: #e7f3ee;
      --water: #1b6ca8;

      --warn: #9a5b00;
      --warn-bg: #fff5e2;
      --danger: #a62626;
      --danger-bg: #fdeaea;
      --ok: #1b6b3a;
      --ok-bg: #e7f6ec;
      --border: #d6dfd9;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding-bottom: 48px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: var(--primary);
    }

    .date-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="date"], input[type="number"], input[type="text"], input[type="url"], select {
      font-size: 19px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    input[type="number"] {
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      padding: 12px 8px;
    }
