<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>每日健康紀錄（含雙向試算表同步）</title>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js" onerror="loadFallbackXlsx()"></script>
  <script>
    function loadFallbackXlsx() {
      if (window.XLSX) return;
      const s = document.createElement('script');
      s.src = 'https://cdn.sheetjs.com/xlsx-0.20.3/package/dist/xlsx.full.min.js';
      document.head.appendChild(s);
    }
  </script>
  <style>
    :root {
      --bg: #f6f8f4;
      --card: #ffffff;
      --text: #1c2822;
      --muted: #586960;
      --primary: #1f6f54;
      --primary-hover: #175640;
      --primary-light: #e7f3ee;
      --water: #1b6ca8;
      --water-light: #e6f2fb;
      --warn: #9a5b00;
      --warn-bg: #fff5e2;
      --danger: #a62626;
      --danger-bg: #fdeaea;
      --ok: #1b6b3a;
      --ok-bg: #e7f6ec;
      --border: #d6dfd9;
      --radius: 18px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft JhengHei", "PingFang TC", sans-serif;
      background: var(--bg);
      color: var(--text);
      font-size: 19px;
      line-height: 1.5;
      padding-bottom: 48px;
    }

    .container {
      max-width: 780px;
      margin: 0 auto;
      padding: 16px;
    }

    header {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      margin-bottom: 14px;
    }

    .top-row {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 26px;
      color: var(--primary);
    }

    .date-box {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    input[type="date"], input[type="number"], input[type="text"], input[type="url"], select {
      font-size: 19px;
      padding: 10px 14px;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: #fff;
      color: var(--text);
    }

    input[type="number"] {
      width: 100%;
      text-align: center;
      font-size: 24px;
      font-weight: 700;
      padding: 12px 8px;
    }

    .user-bar {
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1.5px dashed var(--border);
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
    }

    .user-chip {
      padding: 10px 18px;
      border-radius: 999px;
      border: 2px solid var(--primary);
      background: #fff;
      color: var(--primary);
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .user-chip.active {
      background: var(--primary);
      color: #fff;
    }

    .btn {
      border: none;
      border-radius: 14px;
      padding: 12px 18px;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-hover); }
    .btn-water { background: var(--water); color: #fff; }
    .btn-outline { background: #fff; color: var(--text); border: 2px solid var(--border); }
    .btn-sm { padding: 8px 13px; font-size: 15px; border-radius: 10px; }

    .tabs {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 14px;
    }

    .tab-btn {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: 14px;
      padding: 13px 8px;
      font-size: 18px;
      font-weight: 700;
      color: var(--muted);
      cursor: pointer;
    }

    .tab-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .card {
      background: var(--card);
      border: 2px solid var(--border);
      border-radius: var(--radius);
      padding: 20px;
      margin-bottom: 14px;
    }

    .card h2 {
      margin: 0 0 12px;
      font-size: 22px;
    }

    .period-switch {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 16px;
    }

    .period-btn {
      padding: 12px 8px;
      border-radius: 12px;
      border: 2px solid var(--border);
      background: #fafafa;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .period-btn.active {
      border-color: var(--primary);
      background: var(--primary-light);
      color: var(--primary);
    }

    .bp-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-bottom: 14px;
    }

    .field label {
      display: block;
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .field small {
      color: var(--muted);
      font-size: 14px;
    }

    .status-box {
      padding: 14px 16px;
      border-radius: 14px;
      margin-bottom: 14px;
      font-size: 17px;
      font-weight: 600;
    }

    .status-ok { background: var(--ok-bg); color: var(--ok); }
    .status-warn { background: var(--warn-bg); color: var(--warn); }
    .status-danger { background: var(--danger-bg); color: var(--danger); }

    .summary-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 14px;
    }

    .summary-item {
      background: #f9fbf9;
      border: 1.5px solid var(--border);
      border-radius: 12px;
      padding: 10px;
      text-align: center;
      font-size: 16px;
    }

    .water-progress-wrap {
      background: var(--water-light);
      border-radius: 999px;
      height: 26px;
      overflow: hidden;
      margin: 12px 0;
      border: 1.5px solid #bcd9f0;
    }

    .water-progress-bar {
      height: 100%;
      background: var(--water);
      transition: width 0.25s ease;
    }

    .water-btns {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin: 12px 0;
    }

    .sync-banner {
      margin-top: 10px;
      font-size: 16px;
      color: var(--muted);
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 15px;
    }

    th, td {
      border: 1px solid var(--border);
      padding: 8px 6px;
      text-align: center;
    }

    th {
      background: var(--primary-light);
      color: var(--primary);
    }

    .table-wrap { overflow-x: auto; }
    .hidden { display: none; }

    .version-footer {
      text-align: center;
      font-size: 12px;
      color: var(--muted);
      margin-top: 24px;
      opacity: 0.85;
    }

    @media (max-width: 600px) {
      .bp-grid, .summary-3 { grid-template-columns: 1fr; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
<div class="container">
  <header>
    <div class="top-row">
      <h1>🩺 每日健康紀錄</h1>
      <div class="date-box">
        <label for="recordDate"><strong>日期：</strong></label>
        <input type="date" id="recordDate" />
      </div>
    </div>

    <div class="user-bar" id="userBar"></div>
    <div class="sync-banner" id="globalSyncStatus">雲端狀態：尚未設定 Google 試算表網址（仍可正常使用本機紀錄與 Excel 匯出）</div>
  </header>

  <div class="tabs">
    <button class="tab-btn active" data-tab="bp">❤️ 血壓心跳</button>
    <button class="tab-btn" data-tab="water">💧 喝水紀錄</button>
    <button class="tab-btn" data-tab="history">📊 歷史與雲端</button>
  </div>

  <!-- 分頁 1：血壓心跳 -->
  <section id="tab-bp" class="card">
    <h2>血壓與心跳紀錄（<span id="bpUserName">爸爸</span>）</h2>

    <div class="period-switch">
      <button type="button" class="period-btn" data-period="morning">☀️ 早上</button>
      <button type="button" class="period-btn" data-period="afternoon">🌤️ 中午</button>
      <button type="button" class="period-btn" data-period="evening">🌙 晚上</button>
    </div>

    <div class="bp-grid">
      <div class="field">
        <label for="sysInput">收縮壓（高壓）</label>
        <input type="number" id="sysInput" inputmode="numeric" placeholder="例：125" min="60" max="260" />
        <small>建議參考 &lt; 120–130 mmHg</small>
      </div>
      <div class="field">
        <label for="diaInput">舒張壓（低壓）</label>
        <input type="number" id="diaInput" inputmode="numeric" placeholder="例：78" min="40" max="160" />
        <small>建議參考 &lt; 80 mmHg</small>
      </div>
      <div class="field">
        <label for="hrInput">心跳（次/分）</label>
        <input type="number" id="hrInput" inputmode="numeric" placeholder="例：72" min="30" max="220" />
        <small>安靜休息時 60–100 次/分</small>
      </div>
    </div>

    <div id="bpEvalBox" class="status-box status-ok">請輸入收縮壓與舒張壓數值以查看即時提示。</div>

    <button type="button" class="btn btn-primary" style="width:100%; padding:15px;" id="saveBpBtn">
      💾 儲存本時段並同步至 Google 試算表
    </button>

    <div class="summary-3" id="todayThreePeriods"></div>
  </section>

  <!-- 分頁 2：喝水紀錄 -->
  <section id="tab-water" class="card hidden">
    <h2>每日喝水累計（<span id="waterUserName">爸爸</span>）</h2>
    <div>
      已喝：<strong id="waterCurrentText" style="font-size:28px; color:var(--water);">0</strong> /
      <span id="waterGoalText">2000</span> ml
    </div>
    <div class="water-progress-wrap">
      <div class="water-progress-bar" id="waterProgressBar" style="width:0%"></div>
    </div>

    <div class="water-btns">
      <button type="button" class="btn btn-water" onclick="addWater(150)">+ 150 ml</button>
      <button type="button" class="btn btn-water" onclick="addWater(250)">+ 250 ml</button>
      <button type="button" class="btn btn-water" onclick="addWater(500)">+ 500 ml</button>
    </div>

    <div style="display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-top:12px;">
      <button type="button" class="btn btn-outline btn-sm" onclick="undoWater()">↩️ 復原上一筆</button>
      <label style="font-size:16px;">每日目標 (ml)：
        <input type="number" id="waterGoalInput" value="2000" min="500" max="6000" step="100" style="width:110px; font-size:17px; padding:6px;" onchange="updateWaterGoal()" />
      </label>
    </div>
  </section>

  <!-- 分頁 3：歷史紀錄、Excel 匯出與 Google 試算表同步 -->
  <section id="tab-history" class="card hidden">
    <h2>📊 歷史紀錄與匯出</h2>
    <div style="display:flex; flex-wrap:wrap; gap:10px; margin-bottom:16px;">
      <button type="button" class="btn btn-primary" onclick="exportSingleExcel()">📥 匯出目前使用者 Excel (.xlsx)</button>
      <button type="button" class="btn btn-outline" id="exportBothBtn" onclick="exportAllUsersExcel()">📑 一次匯出所有家人合併 Excel</button>
    </div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>日期</th>
            <th>早壓/心</th>
            <th>中壓/心</th>
            <th>晚壓/心</th>
            <th>喝水(ml)</th>
          </tr>
        </thead>
        <tbody id="historyTableBody"></tbody>
      </table>
    </div>

    <hr style="margin:22px 0; border:none; border-top:1.5px solid var(--border);" />

    <h2>☁️ Google 試算表雙向同步設定</h2>
    <p style="font-size:16px; color:var(--muted); margin-top:0;">
      「從雲端抓回」只會下載<strong>目前選中且同名</strong>的使用者（<strong id="pullTargetName">爸爸</strong>）的雲端資料，不會影響其他家人。
    </p>
    <div style="display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px;">
      <input type="url" id="webhookUrlInput" placeholder="https://script.google.com/macros/s/.../exec" style="flex:1; min-width:240px;" />
      <button type="button" class="btn btn-primary" onclick="saveWebhookUrl()">儲存網址</button>
    </div>
    <div style="display:flex; flex-wrap:wrap; gap:8px;">
      <button type="button" class="btn btn-outline" onclick="pullUserFromCloud()">⬇️ 從雲端抓回「<span id="pullBtnUserName">爸爸</span>」資料</button>
      <button type="button" class="btn btn-outline" onclick="testSyncNow()">⬆️ 推送今天資料到雲端</button>
    </div>
    <div id="syncDetailLog" class="sync-banner"></div>
  </section>

  <footer class="version-footer">版本：rev0.2</footer>
</div>

<script>
  const DEFAULT_WEBHOOK_URL = 'https://script.google.com/macros/s/AKfycbz-lDbXzMfu0Fk7hcGMkxathhvBxaSF8eWfR25pg5_FJrTasHIqadTRWH0POLQ87Qfd/exec';

  const STORAGE_KEY = 'dad_health_tracker_v2';
  const WEBHOOK_KEY = 'dad_health_sheets_webhook_v1';

  function isValidWebhook(url) {
    return typeof url === 'string' && /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/i.test(url.trim());
  }

  function resolveInitialWebhook() {
    try {
      const saved = localStorage.getItem(WEBHOOK_KEY);
      if (saved && saved.trim()) return saved.trim();
    } catch {}
    return isValidWebhook(DEFAULT_WEBHOOK_URL) ? DEFAULT_WEBHOOK_URL.trim() : '';
  }

  function getTodayStr() {
    const d = new Date();
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return `${y}-${m}-${day}`;
  }

  function detectPeriodByTime() {
    const h = new Date().getHours();
    if (h >= 4 && h < 11) return 'morning';
    if (h >= 11 && h < 17) return 'afternoon';
    return 'evening';
  }

  function createEmptyDay(goal = 2000) {
    return {
      morning: { sys: '', dia: '', hr: '' },
      afternoon: { sys: '', dia: '', hr: '' },
      evening: { sys: '', dia: '', hr: '' },
      water: 0,
      waterHistory: [],
      waterGoal: goal
    };
  }

  function loadState() {
    const fallback = {
      users: [{ id: 'dad', name: '爸爸' }],
      activeUserId: 'dad',
      waterGoal: 2000,
      records: {}
    };
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return fallback;
      const parsed = JSON.parse(raw);
      return {
        users: Array.isArray(parsed.users) && parsed.users.length ? parsed.users.slice(0, 2) : fallback.users,
        activeUserId: parsed.activeUserId || 'dad',
        waterGoal: parsed.waterGoal || 2000,
        records: parsed.records || {}
      };
    } catch {
      return fallback;
    }
  }

  let state = loadState();
  let currentDate = getTodayStr();
  let currentPeriod = detectPeriodByTime();
  let webhookUrl = resolveInitialWebhook();

  function saveStateLocal() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch {}
  }

  function getActiveUser() {
    return state.users.find(u => u.id === state.activeUserId) || state.users[0];
  }

  function ensureDayRecord(userId, dateStr) {
    if (!state.records[userId]) state.records[userId] = {};
    if (!state.records[userId][dateStr]) {
      state.records[userId][dateStr] = createEmptyDay(state.waterGoal);
    }
    return state.records[userId][dateStr];
  }

  function renderUsers() {
    const bar = document.getElementById('userBar');
    bar.innerHTML = '';

    state.users.forEach(user => {
      const btn = document.createElement('button');
      btn.type = 'button';
      btn.className = 'user-chip' + (user.id === state.activeUserId ? ' active' : '');
      btn.textContent = `👤 ${user.name}`;
      btn.onclick = () => {
        state.activeUserId = user.id;
        saveStateLocal();
        renderAll();
      };
      bar.appendChild(btn);
    });

    if (state.users.length < 2) {
      const addBtn = document.createElement('button');
      addBtn.type = 'button';
      addBtn.className = 'btn btn-outline btn-sm';
      addBtn.textContent = '➕ 新增第二位家人';
      addBtn.onclick = () => {
        const name = prompt('請輸入第二位家人稱呼（例如：媽媽、阿公、阿嬤）：');
        if (!name || !name.trim()) return;
        state.users.push({ id: 'member_2', name: name.trim() });
        state.activeUserId = 'member_2';
        saveStateLocal();
        renderAll();
      };
      bar.appendChild(addBtn);
    } else {
      const editBtn = document.createElement('button');
      editBtn.type = 'button';
      editBtn.className = 'btn btn-outline btn-sm';
      editBtn.textContent = '✏️ 改名/移除第二位';
      editBtn.onclick = () => {
        const second = state.users[1];
        const nextName = prompt(`修改「${second.name}」的稱呼（留空則移除此使用者）：`, second.name);
        if (nextName === null) return;
        if (!nextName.trim()) {
          state.users = [state.users[0]];
          state.activeUserId = state.users[0].id;
        } else {
          second.name = nextName.trim();
        }
        saveStateLocal();
        renderAll();
      };
      bar.appendChild(editBtn);
    }

    const activeUser = getActiveUser();
    document.getElementById('bpUserName').textContent = activeUser.name;
    document.getElementById('waterUserName').textContent = activeUser.name;
    document.getElementById('pullTargetName').textContent = activeUser.name;
    document.getElementById('pullBtnUserName').textContent = activeUser.name;
    document.getElementById('exportBothBtn').classList.toggle('hidden', state.users.length < 2);
  }

  function evaluateBp(sys, dia) {
    const box = document.getElementById('bpEvalBox');
    const s = Number(sys);
    const d = Number(dia);
    if (!s || !d) {
      box.className = 'status-box status-ok';
      box.textContent = '請輸入收縮壓與舒張壓數值以查看即時提示。';
      return;
    }
    if (s >= 180 || d >= 120) {
      box.className = 'status-box status-danger';
      box.textContent = '⚠️ 數值偏高（≥ 180/120 mmHg）：請先安靜坐著休息 5 分鐘後再量一次，若持續偏高或有不適請儘速就醫。';
    } else if (s >= 140 || d >= 90) {
      box.className = 'status-box status-warn';
      box.textContent = '🔸 血壓略高於一般目標：建議先休息 5 分鐘再複測一次，並留意近期作息與用藥紀錄。';
    } else {
      box.className = 'status-box status-ok';
      box.textContent = '✅ 血壓數值在一般常見範圍內，請繼續保持規律測量！';
    }
  }

  function renderBpTab() {
    document.querySelectorAll('.period-btn').forEach(btn => {
      btn.classList.toggle('active', btn.dataset.period === currentPeriod);
      btn.onclick = () => {
        currentPeriod = btn.dataset.period;
        renderBpTab();
      };
    });

    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    const slot = day[currentPeriod] || { sys: '', dia: '', hr: '' };

    const sysEl = document.getElementById('sysInput');
    const diaEl = document.getElementById('diaInput');
    const hrEl = document.getElementById('hrInput');

    sysEl.value = slot.sys ?? '';
    diaEl.value = slot.dia ?? '';
    hrEl.value = slot.hr ?? '';

    evaluateBp(sysEl.value, diaEl.value);
    sysEl.oninput = diaEl.oninput = () => evaluateBp(sysEl.value, diaEl.value);

    const labels = [
      ['morning', '☀️ 早上'],
      ['afternoon', '🌤️ 中午'],
      ['evening', '🌙 晚上']
    ];
    const summaryContainer = document.getElementById('todayThreePeriods');
    summaryContainer.innerHTML = labels.map(([key, label]) => {
      const p = day[key] || {};
      const bpText = (p.sys && p.dia) ? `${p.sys} / ${p.dia}` : '未紀錄';
      const hrText = p.hr ? `心跳 ${p.hr}` : '—';
      return `<div class="summary-item"><strong>${label}</strong><br/>${bpText}<br/><small>${hrText}</small></div>`;
    }).join('');
  }

  document.getElementById('saveBpBtn').onclick = () => {
    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    day[currentPeriod] = {
      sys: document.getElementById('sysInput').value.trim(),
      dia: document.getElementById('diaInput').value.trim(),
      hr: document.getElementById('hrInput').value.trim()
    };
    saveStateLocal();
    renderBpTab();
    renderHistoryTab();
    syncToGoogleSheets(user.id, currentDate, '已儲存血壓心跳並同步至 Google 試算表');
  };

  function renderWaterTab() {
    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    const goal = day.waterGoal || state.waterGoal || 2000;
    const cur = Number(day.water || 0);
    const pct = Math.min(100, Math.round((cur / goal) * 100));

    document.getElementById('waterCurrentText').textContent = cur;
    document.getElementById('waterGoalText').textContent = goal;
    document.getElementById('waterGoalInput').value = goal;
    document.getElementById('waterProgressBar').style.width = `${pct}%`;
  }

  function addWater(ml) {
    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    day.water = Number(day.water || 0) + ml;
    day.waterHistory = Array.isArray(day.waterHistory) ? day.waterHistory : [];
    day.waterHistory.push(ml);
    saveStateLocal();
    renderWaterTab();
    renderHistoryTab();
    syncToGoogleSheets(user.id, currentDate, `已新增 ${ml} ml 喝水並同步至 Google 試算表`);
  }

  function undoWater() {
    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    if (!Array.isArray(day.waterHistory) || day.waterHistory.length === 0) return;
    const last = day.waterHistory.pop();
    day.water = Math.max(0, Number(day.water || 0) - Number(last || 0));
    saveStateLocal();
    renderWaterTab();
    renderHistoryTab();
    syncToGoogleSheets(user.id, currentDate, '已復原上一筆喝水並同步至 Google 試算表');
  }

  function updateWaterGoal() {
    const val = Math.max(500, Number(document.getElementById('waterGoalInput').value) || 2000);
    state.waterGoal = val;
    const user = getActiveUser();
    const day = ensureDayRecord(user.id, currentDate);
    day.waterGoal = val;
    saveStateLocal();
    renderWaterTab();
    syncToGoogleSheets(user.id, currentDate, '已更新每日喝水目標並同步至 Google 試算表');
  }

  function formatSlotCell(p) {
    if (!p || (!p.sys && !p.dia && !p.hr)) return '—';
    const bp = (p.sys || p.dia) ? `${p.sys || '?'} / ${p.dia || '?'}` : '—';
    return p.hr ? `${bp} (${p.hr})` : bp;
  }

  function renderHistoryTab() {
    const user = getActiveUser();
    const userRecs = state.records[user.id] || {};
    const dates = Object.keys(userRecs).sort().reverse();
    const tbody = document.getElementById('historyTableBody');

    if (!dates.length) {
      tbody.innerHTML = '<tr><td colspan="5">目前尚無紀錄</td></tr>';
      return;
    }

    tbody.innerHTML = dates.map(d => {
      const r = userRecs[d];
      return `<tr>
        <td>${d}</td>
        <td>${formatSlotCell(r.morning)}</td>
        <td>${formatSlotCell(r.afternoon)}</td>
        <td>${formatSlotCell(r.evening)}</td>
        <td>${Number(r.water || 0)}</td>
      </tr>`;
    }).join('');
  }

  function buildUserRows(user) {
    const recs = state.records[user.id] || {};
    return Object.keys(recs).sort().map(d => {
      const r = recs[d];
      const m = r.morning || {};
      const a = r.afternoon || {};
      const n = r.evening || {};
      return {
        '日期': d,
        '姓名': user.name,
        '早上收縮壓': m.sys || '',
        '早上舒張壓': m.dia || '',
        '早上心跳': m.hr || '',
        '中午收縮壓': a.sys || '',
        '中午舒張壓': a.dia || '',
        '中午心跳': a.hr || '',
        '晚上收縮壓': n.sys || '',
        '晚上舒張壓': n.dia || '',
        '晚上心跳': n.hr || '',
        '喝水量(ml)': Number(r.water || 0),
        '每日目標(ml)': Number(r.waterGoal || state.waterGoal || 2000)
      };
    });
  }

  function exportSingleExcel() {
    if (!window.XLSX) {
      alert('Excel 匯出元件尚未載入完成，請檢查網路連線後再試一次');
      return;
    }
    const user = getActiveUser();
    const rows = buildUserRows(user);
    if (!rows.length) {
      alert('目前沒有可匯出的資料');
      return;
    }
    const wb = XLSX.utils.book_new();
    const ws = XLSX.utils.json_to_sheet(rows);
    XLSX.utils.book_append_sheet(wb, ws, user.name.slice(0, 30));
    XLSX.writeFile(wb, `${user.name}_健康紀錄_${getTodayStr()}.xlsx`);
  }

  function exportAllUsersExcel() {
    if (!window.XLSX) {
      alert('Excel 匯出元件尚未載入完成，請檢查網路連線後再試一次');
      return;
    }
    const wb = XLSX.utils.book_new();
    let hasAny = false;
    state.users.forEach(u => {
      const rows = buildUserRows(u);
      if (rows.length) {
        hasAny = true;
        const ws = XLSX.utils.json_to_sheet(rows);
        XLSX.utils.book_append_sheet(wb, ws, u.name.slice(0, 30));
      }
    });
    if (!hasAny) {
      alert('目前沒有可匯出的資料');
      return;
    }
    XLSX.writeFile(wb, `家人健康紀錄合併_${getTodayStr()}.xlsx`);
  }

  function updateSyncStatusText(msg) {
    document.getElementById('globalSyncStatus').textContent = msg;
    document.getElementById('syncDetailLog').textContent = msg;
  }

  function saveWebhookUrl() {
    webhookUrl = document.getElementById('webhookUrlInput').value.trim();
    try {
      localStorage.setItem(WEBHOOK_KEY, webhookUrl);
    } catch {}
    if (!webhookUrl) {
      updateSyncStatusText('雲端狀態：已清除 Google 試算表網址');
      return;
    }
    updateSyncStatusText('雲端狀態：已儲存試算表同步網址，儲存紀錄時將自動同步');
  }

  async function syncToGoogleSheets(userId, dateStr, successMsg) {
    if (!webhookUrl) return;
    const user = state.users.find(u => u.id === userId) || state.users[0];
    const day = ensureDayRecord(user.id, dateStr);
    const payload = {
      userName: user.name,
      date: dateStr,
      waterGoal: day.waterGoal || state.waterGoal || 2000,
      syncedAt: new Date().toLocaleString('zh-TW'),
      record: day
    };

    updateSyncStatusText('雲端狀態：正在同步至 Google 試算表...');
    try {
      await fetch(webhookUrl, {
        method: 'POST',
        mode: 'no-cors',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      updateSyncStatusText(`雲端狀態：${successMsg}（${timeStr}）`);
    } catch (err) {
      updateSyncStatusText(`雲端狀態：同步失敗（${err.message}），資料仍已安全存於本機`);
    }
  }

  async function pullUserFromCloud() {
    if (!webhookUrl) {
      alert('請先輸入並儲存 Google Apps Script 網址');
      return;
    }
    const user = getActiveUser();
    const targetName = user.name.trim();
    if (!targetName) return;

    updateSyncStatusText(`雲端狀態：正在從試算表抓回「${targetName}」的紀錄...`);
    try {
      const endpoint = `${webhookUrl}?action=get&user=${encodeURIComponent(targetName)}&_t=${Date.now()}`;
      const res = await fetch(endpoint);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();

      if (data.status !== 'success') {
        throw new Error(data.message || '雲端回傳非成功狀態');
      }

      const cloudRecords = data.records || {};
      const dates = Object.keys(cloudRecords);

      if (!state.records[user.id]) state.records[user.id] = {};
      dates.forEach(d => {
        const prevLocal = state.records[user.id][d] || createEmptyDay(state.waterGoal);
        const c = cloudRecords[d];
        state.records[user.id][d] = {
          morning: c.morning || prevLocal.morning,
          afternoon: c.afternoon || prevLocal.afternoon,
          evening: c.evening || prevLocal.evening,
          water: typeof c.water === 'number' ? c.water : prevLocal.water,
          waterHistory: prevLocal.waterHistory || [],
          waterGoal: c.waterGoal || prevLocal.waterGoal || state.waterGoal
        };
      });

      saveStateLocal();
      renderAll();

      const timeStr = new Date().toLocaleTimeString('zh-TW', { hour: '2-digit', minute: '2-digit', second: '2-digit' });
      updateSyncStatusText(`雲端狀態：已抓回「${targetName}」共 ${dates.length} 天紀錄，其他家人資料未更動（${timeStr}）`);
    } catch (err) {
      updateSyncStatusText(`雲端狀態：抓回失敗（${err.message}），請確認 Apps Script 已部署新版本且設為「所有人」可存取`);
    }
  }

  function testSyncNow() {
    if (!webhookUrl) {
      alert('請先輸入並儲存 Google Apps Script 網址');
      return;
    }
    const user = getActiveUser();
    syncToGoogleSheets(user.id, currentDate, `已推送 ${user.name}（${currentDate}）資料到雲端`);
  }

  document.querySelectorAll('.tab-btn').forEach(btn => {
    btn.onclick = () => {
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const target = btn.dataset.tab;
      ['bp', 'water', 'history'].forEach(t => {
        document.getElementById(`tab-${t}`).classList.toggle('hidden', t !== target);
      });
    };
  });

  const dateInput = document.getElementById('recordDate');
  dateInput.value = currentDate;
  dateInput.onchange = () => {
    currentDate = dateInput.value || getTodayStr();
    renderAll();
  };

  document.getElementById('webhookUrlInput').value = webhookUrl;
  if (webhookUrl) {
    updateSyncStatusText('雲端狀態：已內建同步連線，支援推送與依同名使用者抓回');
  }

  function renderAll() {
    renderUsers();
    renderBpTab();
    renderWaterTab();
    renderHistoryTab();
  }

  renderAll();
</script>
</body>
</html>
